name: Build Tablet Stats
on:
  workflow_dispatch:
  push:
    paths:
      - "parse_tablet_stats.py"
      - "data/poe2_stats.json"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Extract tablet stats
        run: python parse_tablet_stats.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tablet_stats.json data/tablet_stats_summary.json data/tablet_stat_text_catalog.json
          git diff --cached --quiet || git commit -m "data: generate precise tablet stat catalogue"
          git push
